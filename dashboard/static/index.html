<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PatchProof Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>PatchProof</h1>
    <p class="tagline">CVE exploit verification harness</p>
    <div id="connection-status" class="status-dot disconnected"></div>
  </header>

  <main>
    <section id="scenarios">
      <h2>Scenarios</h2>
      <div id="scenario-grid" class="grid"></div>
    </section>

    <section id="events">
      <h2>Live Events</h2>
      <div id="event-log" class="log"></div>
    </section>

    <section id="approvals">
      <h2>Approval Queue</h2>
      <div id="approval-list" class="list"></div>
    </section>
  </main>

  <footer>
    <p>PatchProof &mdash; <a href="https://github.com/rahulsurwade08/patchproof">GitHub</a></p>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
